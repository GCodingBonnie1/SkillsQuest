<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SkillQuest 5.0</title>
</head>
<meta name="theme-color" content="#b4541a">
<style>
:root{--bg:#f4f1ea;--bg2:#e9e4d8;--card:#fff;--bd:#ddd6c6;--tx:#2a2620;--mut:#7a7263;--ac:#b4541a;--ac2:#e0a458;--ok:#2f855a;--bad:#c53030;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#0d1220;--bg2:#111827;--card:#182033;--bd:#2a3550;--tx:#eef2ff;--mut:#94a3b8;--ac:#60a5fa;--ac2:#a78bfa;--ok:#4ade80;--bad:#f87171;--on:#0b1020}}
:root[data-theme=midnight]{color-scheme:dark;--bg:#0d1220;--bg2:#111827;--card:#182033;--bd:#2a3550;--tx:#eef2ff;--mut:#94a3b8;--ac:#60a5fa;--ac2:#a78bfa;--ok:#4ade80;--bad:#f87171;--on:#0b1020}
:root[data-theme=ocean]{color-scheme:dark;--bg:#04202c;--bg2:#06303f;--card:#0b3b4d;--bd:#17566d;--tx:#e6fbff;--mut:#8cc3d1;--ac:#22d3ee;--ac2:#2dd4bf;--ok:#86efac;--bad:#fca5a5;--on:#032029}
:root[data-theme=sunset]{color-scheme:dark;--bg:#241022;--bg2:#3a1630;--card:#4a1d3b;--bd:#6d2c52;--tx:#fff0f3;--mut:#e0aab8;--ac:#fb923c;--ac2:#f472b6;--ok:#bef264;--bad:#fda4af;--on:#2a0f1f}
:root[data-theme=forest]{color-scheme:dark;--bg:#0f1f15;--bg2:#15301f;--card:#1b3d28;--bd:#2c5c3d;--tx:#effaf1;--mut:#9cc7a9;--ac:#4ade80;--ac2:#facc15;--ok:#86efac;--bad:#fca5a5;--on:#0b1a10}
:root[data-theme=paper]{color-scheme:light}
:root[data-theme=rose]{color-scheme:dark;--bg:#24131d;--bg2:#351b2a;--card:#48263a;--bd:#75425e;--tx:#fff0f6;--mut:#d9aabd;--ac:#f472b6;--ac2:#fb7185;--ok:#86efac;--bad:#fca5a5;--on:#2a1020}
:root[data-theme=lavender]{color-scheme:dark;--bg:#17152b;--bg2:#23213c;--card:#302d50;--bd:#4c4777;--tx:#f3f0ff;--mut:#b8b2da;--ac:#a78bfa;--ac2:#67e8f9;--ok:#86efac;--bad:#fca5a5;--on:#17132d}
:root[data-theme=mint]{color-scheme:light;--bg:#e9f4ed;--bg2:#dcece3;--card:#fbfffc;--bd:#bfd8c8;--tx:#193528;--mut:#547261;--ac:#16845c;--ac2:#5dbb8b;--ok:#228653;--bad:#bc3f46;--on:#fff}
:root[data-theme=ember]{color-scheme:dark;--bg:#21130e;--bg2:#362018;--card:#49291d;--bd:#74412b;--tx:#fff1e5;--mut:#dbb59b;--ac:#fb923c;--ac2:#facc15;--ok:#86efac;--bad:#fca5a5;--on:#2d170c}
:root[data-theme=arctic]{color-scheme:light;--bg:#eaf3f8;--bg2:#dcebf2;--card:#fbfeff;--bd:#bed4df;--tx:#193443;--mut:#557181;--ac:#1477a8;--ac2:#48b5c5;--ok:#24835a;--bad:#c33d54;--on:#fff}
:root[data-theme=royal]{color-scheme:dark;--bg:#151126;--bg2:#211a38;--card:#30254b;--bd:#514071;--tx:#f8f2ff;--mut:#c2b1d6;--ac:#c084fc;--ac2:#fbbf24;--ok:#86efac;--bad:#fca5a5;--on:#21112e}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(ellipse at 12% 0%,color-mix(in srgb,var(--ac) 8%,transparent),transparent 38%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);min-height:100vh;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 22px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid color-mix(in srgb,var(--bd) 75%,transparent)}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
nav button{background:transparent;color:var(--tx);border:1px solid transparent;padding:8px 14px;border-radius:12px;cursor:pointer;font:inherit;white-space:nowrap;transition:background .18s ease,color .18s ease,border-color .18s ease}
nav button:hover{background:color-mix(in srgb,var(--ac) 9%,var(--card))}
nav button.on{background:var(--ac);color:var(--on);font-weight:700;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 24%,transparent)}
.hud{display:flex;gap:8px;font-size:14px;font-weight:700}
.hud span{padding:5px 10px;border:1px solid var(--bd);border-radius:999px;background:var(--card);white-space:nowrap}
main{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:clamp(26px,4vw,32px);line-height:1.2;letter-spacing:-.035em;font-weight:800}
h2{margin:8px 0;line-height:1.25;letter-spacing:-.02em}
h3{line-height:1.3}
.mut{color:var(--mut);font-size:14px}
.card{background:color-mix(in srgb,var(--card) 96%,var(--ac) 4%);border:1px solid var(--bd);padding:18px;border-radius:20px;box-shadow:0 5px 18px color-mix(in srgb,var(--tx) 5%,transparent)}
.big{padding:26px}.big h2{font-size:24px}.big p{font-size:17px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:16px 0 28px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));box-shadow:0 12px 24px color-mix(in srgb,var(--tx) 9%,transparent)}
.icon{display:inline-block;width:1.15em;height:1.15em;flex:none;vertical-align:-.22em;color:inherit;stroke-linecap:round;stroke-linejoin:round}
.e{display:grid;place-items:center;width:54px;height:54px;flex:none;border:1px solid color-mix(in srgb,var(--ac) 18%,var(--bd));border-radius:17px;background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 13%,var(--card)),color-mix(in srgb,var(--ac2) 12%,var(--card)));box-shadow:inset 0 1px 0 color-mix(in srgb,var(--card) 75%,transparent);font-size:30px;line-height:1}
.e .icon{width:36px;height:36px;color:var(--ac)}
.tile .e{margin-bottom:2px}
.profile-identity{display:flex;align-items:center;gap:16px;margin:14px 0}
.avatar-display{display:grid;place-items:center;width:78px;height:78px;flex:none;border:2px solid var(--bd);border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 15%,var(--card)),color-mix(in srgb,var(--ac2) 12%,var(--card)));color:var(--ac);box-shadow:0 6px 18px color-mix(in srgb,var(--tx) 10%,transparent)}
.avatar-display .icon{width:48px;height:48px}
.avatar-display.frame-trailblazer{border:3px solid #e0a458;box-shadow:0 0 0 4px color-mix(in srgb,#e0a458 20%,transparent),0 6px 18px color-mix(in srgb,var(--tx) 10%,transparent)}
.avatar-display.frame-constellation{border:3px solid #a78bfa;box-shadow:0 0 0 4px color-mix(in srgb,#a78bfa 22%,transparent),0 0 20px color-mix(in srgb,#67e8f9 32%,transparent)}
.avatar-display.frame-laurel{border:3px double #4ade80;box-shadow:0 0 0 4px color-mix(in srgb,#4ade80 18%,transparent),0 6px 18px color-mix(in srgb,var(--tx) 10%,transparent)}
.store-card{position:relative;overflow:hidden}
.swatch{width:100%;height:62px;border:1px solid var(--bd);border-radius:13px;margin-bottom:4px;background:linear-gradient(135deg,var(--swatch-a),var(--swatch-b))}
.swatch:after{content:"";display:block;width:52%;height:24px;margin:18px auto;border:1px solid color-mix(in srgb,var(--swatch-tx) 30%,transparent);border-radius:8px;background:color-mix(in srgb,var(--swatch-card) 86%,transparent)}
.shop-section{margin-top:24px}
.shop-section h2{margin-bottom:4px}
.shop-card-button{margin-top:8px}
.shop-card-button:disabled{opacity:.55;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
.coin-balance{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid color-mix(in srgb,var(--ac2) 45%,var(--bd));border-radius:999px;background:color-mix(in srgb,var(--ac2) 10%,var(--card));font-weight:750}
.btn{background:var(--ac);color:var(--on);border:1px solid color-mix(in srgb,var(--ac) 85%,var(--tx));padding:11px 18px;border-radius:13px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px;box-shadow:0 3px 9px color-mix(in srgb,var(--ac) 18%,transparent);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 5px 12px color-mix(in srgb,var(--ac) 24%,transparent)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--ac) 12%,var(--card));color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 24%,var(--bd));padding:3px 10px;border-radius:999px;font-size:12px;font-weight:750}
.tag{font-size:12px;font-weight:750;color:var(--ac);text-transform:uppercase;letter-spacing:.07em}
.bar{height:10px;background:color-mix(in srgb,var(--bd) 76%,var(--bg2));border-radius:999px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:inherit;transition:width .4s ease}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:13px 16px;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:14px;font:inherit;cursor:pointer;transition:border-color .16s ease,background .16s ease,transform .16s ease}
.opt:hover{border-color:var(--ac);transform:translateY(-1px)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.done{opacity:.68}.lock{filter:grayscale(1);opacity:.5}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,400px);aspect-ratio:1;border:6px solid color-mix(in srgb,var(--ac) 15%,var(--bd));border-radius:16px;overflow:hidden;margin:14px 0;background:var(--bg2);box-shadow:0 8px 22px color-mix(in srgb,var(--tx) 10%,transparent)}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,34px);cursor:pointer;line-height:1;transition:background .15s ease}
.chess-piece{width:80%;height:80%;filter:drop-shadow(0 1px 1px color-mix(in srgb,var(--tx) 20%,transparent))}
.sq.l{background:color-mix(in srgb,var(--card) 90%,var(--ac2) 10%);color:var(--tx)}
.sq.d{background:color-mix(in srgb,var(--bg2) 78%,var(--ac) 22%);color:var(--tx)}
.sq.s{outline:3px solid var(--ac);outline-offset:-3px;background:color-mix(in srgb,var(--ac) 28%,var(--card))}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px}
.plot{aspect-ratio:1;font-size:34px;border-radius:17px;border:1px solid var(--bd);background:linear-gradient(145deg,var(--bg2),color-mix(in srgb,var(--ac) 7%,var(--card)));cursor:pointer;color:var(--tx);box-shadow:0 3px 10px color-mix(in srgb,var(--tx) 5%,transparent);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.plot:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));box-shadow:0 6px 14px color-mix(in srgb,var(--tx) 9%,transparent)}
.typ{font:20px/1.8 ui-monospace,Menlo,monospace;letter-spacing:.02em}.typ .g{color:var(--ok)}.typ .r{color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,transparent)}.typ .c{border-bottom:2px solid var(--ac)}
textarea,input.in{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:15px ui-monospace,Menlo,monospace}
textarea:focus,input.in:focus{outline:2px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:2px;border-color:var(--ac)}
iframe{width:100%;height:170px;border:1px solid var(--bd);border-radius:14px;background:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--tx) 7%,transparent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.game-banner{display:flex;align-items:center;gap:14px;margin:12px 0}
.game-banner .e{width:62px;height:62px}
.course-hero{position:relative;overflow:hidden;padding:clamp(20px,4vw,32px);background:radial-gradient(ellipse at 100% 0%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 48%),linear-gradient(135deg,color-mix(in srgb,var(--card) 92%,var(--ac) 8%),var(--card))}
.course-hero:after{content:"";position:absolute;right:-40px;bottom:-80px;width:210px;height:210px;border:1px solid color-mix(in srgb,var(--ac) 16%,transparent);border-radius:50%;box-shadow:0 0 0 24px color-mix(in srgb,var(--ac) 5%,transparent),0 0 0 50px color-mix(in srgb,var(--ac) 4%,transparent);pointer-events:none}
.course-heading{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.course-heading .e{width:68px;height:68px}
.course-heading h1{margin-top:5px}
.course-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.course-stat{padding:7px 11px;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--bd);border-radius:999px;font-size:13px;font-weight:700}
.level-card{min-height:185px;position:relative}
.level-card .bar{margin-top:14px}
.lesson-card{min-height:172px}
.lesson-card .lesson-kind{margin:8px 0;color:var(--mut);font-size:13px}
.lesson-shell{max-width:780px;margin:0 auto}
.lesson-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}
.lesson-steps{display:flex;gap:5px;margin:10px 0 18px}
.lesson-steps i{height:5px;flex:1;background:var(--bd);border-radius:999px}
.lesson-steps i.done{background:var(--ok)}
.lesson-steps i.current{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.lesson-content{padding:clamp(20px,4vw,32px);margin:14px 0}
.lesson-content h2{margin:8px 0 12px;font-size:clamp(22px,3vw,30px)}
.lesson-content p{margin:10px 0}
.lesson-takeaway{margin-top:18px;padding:14px 16px;border-left:4px solid var(--ac2);border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--ac2) 9%,var(--card))}
.lesson-takeaway strong{display:block;color:var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.lesson-checklist{display:grid;gap:7px;margin:14px 0 0;padding:14px 16px;border:1px solid var(--bd);border-radius:14px;background:color-mix(in srgb,var(--bg2) 60%,var(--card))}
.lesson-checklist span{color:var(--mut);font-size:14px}
.lesson-actions{display:flex;flex-wrap:wrap;gap:8px}
.lesson-actions .btn{margin-top:8px}
.lesson-reward{color:var(--ac);font-weight:750;font-size:13px}
.mastery-stamp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid color-mix(in srgb,var(--ok) 35%,var(--bd));border-radius:999px;background:color-mix(in srgb,var(--ok) 10%,var(--card));color:var(--ok);font-size:12px;font-weight:750}
.workshop-hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}
.workshop-mission{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.mission-number{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--ac);color:var(--on);font-weight:800}
.mission-focus{padding:12px 14px;border:1px solid var(--bd);border-radius:13px;background:color-mix(in srgb,var(--ac) 5%,var(--card));margin:12px 0}
.mission-focus p{margin-top:5px}
.result-banner{padding:clamp(22px,5vw,40px);text-align:center;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--ac2) 16%,transparent),transparent 60%),var(--card)}
.result-banner .e{margin:0 auto 12px;width:72px;height:72px}
.result-banner h2{font-size:clamp(24px,4vw,34px)}
.result-rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0}
.game-dossier{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;margin:0 0 16px;padding:14px 17px;border:1px solid var(--bd);border-radius:17px;background:linear-gradient(110deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card) 72%);box-shadow:0 4px 14px color-mix(in srgb,var(--tx) 4%,transparent)}
.game-dossier strong{display:block;font-size:17px;line-height:1.3}
.game-dossier p{margin-top:3px;color:var(--mut);font-size:13px}
.game-dossier .bar{grid-column:1/-1;margin:0;height:6px}
.game-dossier-meta{display:grid;justify-items:end;gap:3px;text-align:right}
.game-round{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.game-round .badge{font-size:13px}
.game-feedback{min-height:44px;margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 6%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 18%,var(--bd))}
.game-result{max-width:760px;margin:18px auto;padding:clamp(22px,5vw,36px);background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--ac) 15%,transparent),transparent 60%),var(--card);border:1px solid var(--bd);border-radius:24px;text-align:center;box-shadow:0 16px 40px color-mix(in srgb,var(--tx) 8%,transparent)}
.game-result h2{margin:10px 0}
.game-result p{max-width:58ch;margin:8px auto;color:var(--mut)}
.game-result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.robot-buddy{display:flex;align-items:flex-start;gap:12px;margin:12px 0;padding:13px 15px;border:1px solid color-mix(in srgb,var(--ac2) 32%,var(--bd));border-radius:16px;background:linear-gradient(115deg,color-mix(in srgb,var(--ac2) 11%,var(--card)),var(--card) 76%)}
.robot-avatar{display:grid;place-items:center;width:42px;height:42px;flex:none;border:1px solid color-mix(in srgb,var(--ac2) 35%,var(--bd));border-radius:14px;background:color-mix(in srgb,var(--ac2) 12%,var(--card));color:var(--ac)}
.robot-avatar .icon{width:29px;height:29px}
.robot-buddy p{margin:2px 0;color:var(--tx);font-size:14px}
.robot-buddy .tag{font-size:11px}
.robot-hint{margin-top:5px;color:var(--ac);font-size:13px;font-weight:700}
.robot-hint summary{cursor:pointer}
.robot-hint p{margin:5px 0 0;color:var(--mut);font-weight:400}
.robot-rival{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;margin:12px 0;border:1px solid var(--bd);border-radius:16px;background:color-mix(in srgb,var(--ac) 5%,var(--card))}
.robot-rival .robot-avatar{width:48px;height:48px}
.robot-rival-score{font-size:20px;font-weight:850;color:var(--ac);text-align:right}
.game-intro{max-width:760px;margin:18px auto;padding:clamp(20px,5vw,34px);border:1px solid var(--bd);border-radius:24px;background:radial-gradient(ellipse at 85% 0%,color-mix(in srgb,var(--ac2) 15%,transparent),transparent 52%),var(--card);box-shadow:0 12px 32px color-mix(in srgb,var(--tx) 7%,transparent)}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px;border:1px solid var(--bd);border-radius:15px;background:var(--card);color:var(--tx);text-align:left;font:inherit;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
.mode-card:hover{transform:translateY(-2px);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--card))}
.mode-card strong{font-size:16px}
.mode-card span{color:var(--mut);font-size:13px}
.math-equation{font-size:clamp(36px,9vw,62px);font-weight:850;letter-spacing:-.04em;text-align:center;padding:18px 8px}
.math-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.math-options .opt{margin:0;text-align:center;font-size:clamp(18px,4vw,25px)}
.math-race-track{display:flex;justify-content:space-between;gap:10px;margin:8px 0;color:var(--mut);font-size:13px;font-weight:700}
.math-race-track .player{color:var(--ac)}
.streak-pill{display:inline-flex;align-items:center;gap:5px;color:var(--ac);font-weight:800}
.garden-plot{position:relative}
.memory-card{font-size:clamp(22px,7vw,34px);font-weight:800;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.memory-card:hover{transform:translateY(-2px)}
.memory-card.revealed{background:color-mix(in srgb,var(--ac) 12%,var(--card));border-color:var(--ac)}
.memory-card.matched{background:color-mix(in srgb,var(--ok) 15%,var(--card));border-color:var(--ok);cursor:default}
.code-hint{margin-top:10px;padding:12px 14px;border:1px dashed var(--bd);border-radius:12px;color:var(--mut);font-size:14px}
.typing-caret{display:inline-block;width:2px;height:1.25em;background:var(--ac);vertical-align:middle;animation:caret-blink 1s step-end infinite}
@keyframes caret-blink{50%{opacity:0}}
@media(max-width:480px){.game-dossier{grid-template-columns:1fr}.game-dossier-meta{justify-items:start;text-align:left}.game-dossier .bar{grid-column:1}.game-result-actions{display:grid}.game-result-actions .btn{width:100%}.math-options{grid-template-columns:1fr}.robot-rival{grid-template-columns:auto 1fr}.robot-rival-score{grid-column:2;text-align:left}}
@keyframes quest-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.lesson-content,.result-banner{animation:quest-enter .28s ease both}
.mission-card{margin-top:14px}
.mission-work{display:block;width:100%;margin-top:12px;min-height:110px;padding:13px 15px;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:14px;font:inherit;resize:vertical}
.mission-work:focus{outline:2px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:2px;border-color:var(--ac)}
.sequence-list,.sequence-pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sequence-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--bd));border-radius:12px}
.sequence-chip button{border:0;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.sequence-pool .chip:disabled{opacity:.45}
.coach-card{margin-top:14px;background:color-mix(in srgb,var(--ok) 8%,var(--card))}
svg.ph{width:min(100%,520px);border:1px solid var(--bd);border-radius:16px;cursor:crosshair;display:block;margin:12px 0;box-shadow:0 6px 18px color-mix(in srgb,var(--tx) 10%,transparent)}
.toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20}
.toast{background:var(--ac);color:var(--on);padding:10px 16px;border:1px solid color-mix(in srgb,var(--ac) 80%,var(--tx));border-radius:14px;font-weight:700;box-shadow:0 8px 24px color-mix(in srgb,var(--tx) 18%,transparent)}
.fb{margin-top:12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;transition:background .16s ease,border-color .16s ease}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 70%,transparent);outline-offset:2px}
button:disabled{cursor:default}
@media(max-width:700px){header{padding:12px 14px}main{padding:22px 14px 48px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}.hud{width:100%;justify-content:flex-start}}
@media(max-width:480px){.course-heading{align-items:flex-start;gap:11px}.course-heading .e{width:54px;height:54px}.course-stat{font-size:12px}.lesson-head{align-items:flex-start}.lesson-content{padding:20px}.lesson-actions{display:grid}.lesson-actions .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
#app>*{animation:sqIn .22s ease both}@keyframes sqIn{from{opacity:0;transform:translateY(6px)}}
.opt.ok{animation:sqPop .3s}.opt.bad{animation:sqShake .3s}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
@keyframes sqPop{50%{transform:scale(1.025)}}@keyframes sqShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
[data-anim="0"] *,[data-anim="0"] *::before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app[data-cat]{border-top:4px solid var(--cat);padding-top:20px}
.campaign{display:grid;gap:14px;margin-top:16px}.loc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.loc.won{border-color:var(--ok)}.loc.lock,.boss.lock{opacity:.62}.boss{border:2px solid var(--ac2);margin-top:14px}
.nodes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.node{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:8px 2px;border:2px solid var(--bd);border-radius:14px;background:var(--bg2);color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.node small{font-size:10px;font-weight:600;color:var(--mut)}.node.done{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}.node.star{border-color:var(--ac2)}
@media(max-width:560px){.nodes{grid-template-columns:repeat(3,1fr)}}
.btn,.chip,.opt{min-height:44px}
.clock{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);padding:8px 14px;border-radius:999px;font-weight:800;z-index:20}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}.modal>.card{max-width:520px;width:100%}
.pop{position:absolute;right:16px;top:100%;z-index:30;display:grid;gap:8px}
.sv{font-size:12px;color:var(--ok);animation:sqIn .3s,sqOut 2s 1s forwards}@keyframes sqOut{to{opacity:0}}
.mastered{box-shadow:0 0 0 4px var(--ac2)!important}body.nohint details.robot-hint{display:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:16px 0}
.bars{display:flex;gap:6px;align-items:flex-end;height:60px}.bars i{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
@media print{header,.btn,nav{display:none!important}}

.sqs{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:6px 8px 6px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;max-width:560px}
.sqs:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.sqs input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;padding:8px 0}
.sqs button{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:8px 10px;border-radius:9px;min-height:36px}
.sqs button:hover,.sqs button:focus-visible{background:color-mix(in srgb,var(--ac) 15%,transparent);outline:2px solid var(--ac)}
.sqs-count{font-size:12px;opacity:.7;white-space:nowrap}
.sqs-hide{display:none!important}
.sqs-empty{padding:26px;text-align:center;border:1px dashed var(--bd);border-radius:16px;margin:12px 0}
.sqs-tools{margin:24px 0}.sqs-tools .btn{margin-right:8px}
</style>
</head>

["journalism","Journalism","Communication","note","Journalism separates verified facts from claims, identifies sources, and explains why information matters.","A quote is evidence of what someone said, not proof that the statement is true.","Create a short report that distinguishes confirmed details from unanswered questions.","Confirm names, dates, and claims independently; attribute quotes; clearly label what remains uncertain.","Who and what; source verification; interviewing; fair context; accurate headline and correction"],
["research","Research Skills","Communication","search","Research begins with a focused question and uses credible sources whose evidence and limits are checked.","A review article can help map a field, while the original study answers method details.","Build a small evidence trail for a claim using two independent sources.","Record author, date, method, and limits; compare sources instead of treating search ranking as quality.","Focus a question; search terms; evaluate sources; take evidence notes; synthesize and cite"],
["notes","Note Taking","Communication","note","Useful notes capture key ideas in your own words, mark questions, and make later review active.","After a lesson, close the notes and sketch the three main ideas from memory.","Turn a dense page into a compact review sheet and a self-test.","Group related ideas, write a short summary, flag uncertainties, and add questions you can answer later.","Listen for structure; capture key points; paraphrase; organize connections; active review"],
["teamwork","Teamwork","Communication","handshake","Strong teams agree on a goal, roles, communication norms, and a way to resolve blockers.","A shared checklist prevents two teammates from doing the same task while another is missed.","Run a short team project with fair roles and a clear handoff.","Agree on the outcome, name an owner for each task, check progress, and ask for help early.","Shared goal; roles and strengths; clear handoffs; useful feedback; reflect and adjust"],
["conflict","Conflict Resolution","Communication","speech","Constructive conflict focuses on the problem and impact, uses specific observations, and makes a workable request.","“When the files arrived late, I missed the review window; can we agree on a deadline?”","Practice repairing a disagreement without blame or mind-reading.","Describe what happened, explain its impact, ask about their view, and agree on a specific next action.","Pause and regulate; describe observations; hear both needs; propose options; agree and follow up"],
["email","Professional Email","Communication","note","A useful email has a specific subject, brief context, a clear request, and a courteous close.","“Request: feedback on draft by Thursday” is more useful than “Question”.","Rewrite a vague email so the reader knows what you need and by when.","Put the ask near the top, include only necessary context, and state a realistic deadline.","Subject lines; audience and tone; concise context; clear requests; proofread and follow up"],
["interview","Interviewing","Communication","mic","Good interviews use open questions, attentive follow-ups, consent, and accurate notes.","“What happened next?” invites more detail than a leading yes-or-no question.","Interview a partner about a hobby and summarize their point fairly.","Ask permission, use open prompts, follow their answer, and check your summary before sharing it.","Prepare a purpose; open questions; follow-ups; consent and trust; accurate summary"],
["animation","Animation","Creative","film","Animation creates motion from sequential poses. Spacing controls apparent speed; timing shapes weight and emotion.","A bouncing ball spreads frames while falling, then compresses on impact.","Animate a short bounce that feels heavy instead of floating.","Use wider spacing for faster motion, fewer frames near impact, and squash at contact to suggest weight.","Frames and timing; spacing; arcs; squash and stretch; refine a loop"],
["type","Typography","Creative","note","Typography guides reading through type size, weight, line length, and spacing. Readability comes before decoration.","A short heading in a strong weight and body text with comfortable line spacing builds hierarchy.","Design a poster with a title, subtitle, and details that read in order.","Limit font families, create clear size contrast, align elements, and test at the size people will view it.","Type anatomy; hierarchy; pairing; spacing and line length; accessible layout"],
["graphic","Graphic Design","Creative","palette","Graphic design solves a communication problem by combining hierarchy, contrast, alignment, and repetition.","A consistent icon and color system helps people recognize related actions.","Create a small event poster that communicates what, when, and where at a glance.","Make the event name dominant, group date and place, align edges, and remove decoration that competes.","Brief and audience; hierarchy; contrast; alignment and repetition; critique and refine"],
["poetry","Poetry","Creative","pencil","Poetry uses sound, image, rhythm, line breaks, and precise words to create layered meaning.","Replacing “the room was loud” with a concrete sound image makes a scene more vivid.","Write a short poem that shows a mood without naming the emotion.","Choose sensory details, read aloud for rhythm, and revise any line that explains what an image already shows.","Observe concrete details; image and metaphor; sound and rhythm; line breaks; revise for precision"],
["theater","Theater","Creative","mask","Theater communicates through objective, action, voice, movement, and listening between performers.","A character who wants to leave may hide it through polite words and restless movement.","Stage a short scene where the character's goal is clear without explaining it.","Give the character an objective, choose an action, use a pause, and respond to the scene partner.","Character objective; action and obstacle; voice and movement; blocking; ensemble rehearsal"],
["craft","Craft Design","Creative","pencil","A successful craft balances purpose, materials, structure, and a finish that suits how it will be used.","A paper lantern needs stable folds and safe light, not just decorative surfaces.","Prototype a useful desk organizer from scrap materials.","Sketch the compartments, test whether the material holds weight, then reinforce weak joints.","Define use; choose materials; sketch structure; build a quick prototype; test and improve"],
["sound","Sound Design","Creative","music","Sound design uses ambience, effects, and silence to shape a listener's sense of place and action.","A door sound with room echo feels farther away than the same dry recording.","Build a 10-second soundscape that moves from a quiet room to a busy station.","Layer a steady ambience, add a few distinct foreground sounds, and control levels so nothing clips.","Listen for layers; record safely; select effects; balance and spatialize; export and review"],
["visualstory","Visual Storytelling","Creative","camera","A visual sequence guides attention through framing, contrast, and changes from one image to the next.","A wide shot establishes place before a close-up reveals the clue.","Tell a beginning-middle-end story in three images without captions.","Give each frame a distinct job, keep visual continuity, and make the last image change the meaning.","Choose a point of view; compose a frame; sequence images; use visual contrast; edit for clarity"],
["instrument","Instrument Practice","Creative","music","Deliberate music practice isolates a small passage, slows it down, listens for accuracy, and gradually raises tempo.","Play four clean bars slowly before attempting the whole piece at speed.","Design a 10-minute practice loop for a tricky musical phrase.","Set a comfortable tempo, repeat a short section correctly, note one adjustment, then increase speed slightly.","Posture and setup; steady pulse; break into phrases; listen and correct; build a performance"],
["photocomposition","Photo Composition","Creative","camera","Composition directs attention through framing, balance, light, and point of view; there is no single rule that fits every photograph.","Moving a subject off-center can leave useful negative space and make a portrait feel less static.","Create a three-frame photo plan that guides a viewer toward one subject.","Choose a clear subject, simplify distractions, use light intentionally, and check whether the frame supports the story.","Subject and frame; rule of thirds; leading lines; light and depth; sequence and visual story"],
["history","World History","Humanities","book","Historical explanations use evidence from sources and place events in context; one source rarely tells the whole story.","A diary shows one person's experience, while a census can reveal a wider pattern.","Compare two accounts of the same event and mark where perspective differs.","Check who created each source, when, for whom, and what evidence supports its claims.","Timeline and context; primary sources; perspective; cause and consequence; evidence-based narrative"],
["civics","Civics","Humanities","trophy","Civic systems divide responsibilities, define rights, and provide ways for people to participate and hold leaders accountable.","A local council may decide local services while national government handles other powers.","Trace a community issue to the level of government that can act on it.","Identify the rule or service, find the responsible office, then choose a lawful participation route.","Rights and responsibilities; branches and levels; elections; local decisions; civic participation"],
["economics","Economics","Humanities","chart","Economics studies choices under scarcity. Opportunity cost is the next-best option given up when choosing.","Spending an hour gaming means giving up the next-best use of that hour.","Allocate a limited project budget and explain the trade-offs.","List constraints, compare marginal benefits, and state what valuable alternative the chosen plan replaces.","Scarcity and choice; opportunity cost; supply and demand; incentives; trade-offs and wellbeing"],
["maps","Map Reading","Humanities","map","Maps encode place with scale, symbols, orientation, and projections. Every map simplifies reality for a purpose.","A transit map distorts distance to make route connections easier to see.","Navigate from a station to a landmark using a map legend and scale.","Orient the map, match symbols to the legend, check scale, and verify the route at a crossing.","Legend and symbols; orientation; scale and distance; contour lines; choose a map for a task"],
["anthro","Cultural Anthropology","Humanities","globe","Anthropology studies how people make meaning in context. Avoid treating one person's experience as a whole culture.","Ask how a community describes a practice instead of assuming outsiders' labels fit.","Compare two everyday routines while avoiding stereotypes and respecting privacy.","Describe what you observed, ask about local meaning, and note differences within each community.","Culture and context; observation; respectful questions; variation within groups; compare without ranking"],
["media","Media Literacy","Humanities","computer","Media literacy checks author, evidence, purpose, framing, and missing context before sharing a claim.","A cropped video may omit what happened before the clip began.","Investigate a viral post and decide what can actually be verified.","Trace the original, check date and location, look for independent reporting, and separate fact from interpretation.","Author and purpose; evidence; image and video context; emotional framing; verify before sharing"],
["ethics","Ethics","Humanities","heart","Ethical reasoning makes values, affected people, likely outcomes, and duties explicit rather than hiding them in a gut reaction.","A fair group decision considers who benefits, who bears the cost, and whether consent is respected.","Facilitate a dilemma discussion where reasonable people disagree.","Name the values in tension, consider stakeholders and consequences, and explain what evidence could change your view.","Values and duties; stakeholders; consequences; fairness and consent; defend and revise a position"],
["law","Legal Literacy","Humanities","book","Legal literacy starts with jurisdiction, reliable primary rules, and careful language; a general explanation is not individual legal advice.","A lease rule depends on local law and the exact contract terms.","Find the right type of official source for a basic rights question.","Identify location and issue, prefer government or court sources, and seek qualified help for a real dispute.","Rules and jurisdiction; contracts; rights and responsibilities; official sources; when to seek legal help"],
["archaeology","Archaeology","Humanities","search","Archaeologists infer past behavior from artifacts in context. Removing an object destroys information about where it was found.","A tool's location beside a hearth can matter as much as the tool itself.","Interpret a mock dig site without moving artifacts out of their layers.","Record position and layer, compare nearby materials, and state multiple explanations with confidence limits.","Artifacts and context; stratigraphy; careful recording; compare evidence; protect heritage"],
["myth","Mythology","Humanities","book","Myths transmit cultural ideas through recurring characters, symbols, and conflicts; versions vary across storytellers and time.","A journey story can explore courage while also reflecting its community's values.","Compare two retellings and explain what each version emphasizes.","Notice who tells the story, which symbols recur, and how the changes alter its meaning.","Myth and oral tradition; archetypes; symbols; compare versions; respectful interpretation"],
["wildlife","Wildlife Ecology","Environment","leaf","Wildlife populations depend on habitat, food, migration routes, and disturbance. Observation should minimize harm.","A corridor between habitat patches lets animals move to food and breeding sites.","Map a safe wildlife corridor through a changing landscape.","Connect feeding, shelter, and movement needs; reduce barriers and keep observation at a respectful distance.","Habitat needs; food webs; movement and corridors; human disturbance; conservation evidence"],
["conserve","Conservation","Environment","leaf","Conservation protects biodiversity by addressing threats and supporting habitat, populations, and local stewardship.","Restoring native plants can support pollinators while reducing invasive cover.","Choose a conservation action based on local evidence rather than a viral claim.","Identify the pressure, use trusted local guidance, measure impact, and include the community affected.","Biodiversity; threats and status; habitat restoration; measure outcomes; community stewardship"],
["weatherread","Weather Reading","Environment","cloud","Weather forecasts combine observations and models; probability describes uncertainty, not a promise that an event will occur.","A 40% rain forecast means rain is plausible in the forecast area, not that it rains for 40% of the day.","Plan an outdoor event using forecast probability and a practical backup.","Check timing and local updates, understand the probability, and prepare a backup proportional to the risk.","Cloud clues; fronts; pressure; forecast probability; communicate changing risk"],
["climate","Climate Solutions","Environment","sun","Climate solutions reduce greenhouse gas emissions or help communities adapt to impacts; choices should be measured over their full lifecycle.","Insulation can cut heating demand for years, often more reliably than a one-time offset claim.","Compare two realistic ways a school could reduce energy use.","Estimate the baseline, include upfront and ongoing impacts, and check who benefits or bears the cost.","Weather versus climate; emissions sources; mitigation; adaptation; evaluate impact and fairness"],
["soil","Soil Science","Environment","soil","Healthy soil contains mineral particles, organic matter, air, water, and living organisms; texture affects drainage and roots.","Sandy soil drains quickly, while clay holds water and can compact.","Diagnose a garden bed's drainage and choose a suitable improvement.","Observe texture and water movement; add organic matter gradually rather than assuming fertilizer fixes structure.","Soil texture; layers and organisms; drainage; nutrients and pH; protect soil structure"],
["compost","Composting","Environment","leaf","Composting balances carbon-rich dry materials with nitrogen-rich greens, moisture, and air so decomposers can work.","Dry leaves plus vegetable scraps and occasional turning can create compost.","Rescue a smelly compost pile by finding the missing balance.","Add dry browns if wet and smelly, add greens if too dry, then improve airflow and monitor moisture.","Decomposers and heat; greens and browns; moisture balance; airflow and turning; mature compost"],
["native","Native Plants","Environment","plant","Native plants are adapted to local conditions and can support local food webs; the right choice depends on place and site.","A locally native flowering plant can provide nectar when nearby pollinators need it.","Select plants for a small pollinator patch using a local source.","Check region and sunlight, choose varied bloom times, and avoid invasive lookalikes.","Native range; local references; sun and soil; pollinator resources; maintain and monitor"],
["water","Water Stewardship","Environment","water","Water stewardship protects supply and quality by reducing waste, preventing pollution, and matching use to local conditions.","Fixing a running toilet can save more water than shortening one shower.","Audit a household water-use scenario and prioritize a measurable fix.","Find the largest repeat use, repair leaks first, and choose a change that can be measured over a week.","Water cycle and watersheds; indoor use; irrigation; pollution prevention; measure conservation"],
["sustain","Sustainable Design","Environment","leaf","Sustainable design considers materials, energy, repair, reuse, and end-of-life impacts across a product's life.","A repairable water bottle can outlast repeated disposable bottles if it is actually reused.","Redesign a school item to reduce waste without making it harder to use.","Map materials and use, prevent waste first, choose durable repairable parts, and plan reuse or recovery.","Lifecycle thinking; prevent material waste; durability and repair; energy and transport; measure trade-offs"],
["field","Field Observation","Environment","search","Careful field notes separate observation from interpretation and record time, place, conditions, and uncertainty.","“Three bees visited the flower in two minutes” is more testable than “the garden is healthy.”","Run a short observation and turn it into a question that can be tested.","Record exactly what you saw, note conditions, repeat at another time, and avoid claiming cause from one observation.","Observe safely; record place and time; count consistently; separate inference; share uncertainty"],
["wood","Woodworking","Maker Skills","wrench","Woodworking depends on measuring, grain direction, stable workholding, and tool safety before cutting.","Clamping a board prevents movement while a hand saw follows a marked line.","Plan a small wooden stand with safe cuts and a stable base.","Mark from a reference edge, secure the work, keep hands clear of the cut, and test stability before finishing.","Shop safety; measure and mark; grain and joints; cut and assemble; sand and finish"],
["tools","Hand Tools","Maker Skills","wrench","Hand tools work best when matched to the fastener or material and used with controlled force.","A correctly sized wrench grips a nut without rounding its edges.","Identify the right tool for a loose hinge and explain how to avoid damage.","Choose the fitting size, support the work, apply steady force, and stop if the part slips or cracks.","Tool names and uses; select a fit; grip and leverage; inspect wear; safe cleanup and storage"],
["model3d","3D Modeling","Maker Skills","computer","A 3D model uses dimensions and constraints so its shape can be edited, inspected, and prepared for making.","A hole stays centered when constrained to the centerline rather than positioned by eye.","Model a simple bracket with a measured hole and check it from multiple views.","Set key dimensions, constrain relationships, inspect for intersections, and verify the model against its purpose.","Axes and primitives; dimensions; constraints; inspect and revise; export for fabrication"],
["prototype","Product Prototyping","Maker Skills","puzzle","A prototype tests a specific assumption cheaply. Feedback should change the next version, not just decorate it.","A cardboard handle tests grip before a costly final material is chosen.","Prototype a tool handle for comfort and compare two shapes with users.","State what you are testing, make the smallest useful model, observe use, then revise one feature.","Define the user and need; sketch options; choose cheap materials; test a hypothesis; iterate from feedback"],
["patterns","Sewing Patterns","Maker Skills","pencil","Patterns translate body or object measurements into pieces with grain, markings, and seam allowance.","A grainline arrow keeps fabric stretch and drape consistent across matching pieces.","Adjust a simple pattern to a new measurement without losing its shape.","Measure the wearer, adjust designated lines, preserve grain direction, and include seam allowances before cutting.","Read pattern symbols; take measurements; grain and layout; adjust fit; assemble and test"],
["paper","Paper Engineering","Maker Skills","book","Paper structures gain strength from folds, curves, tabs, and triangulation rather than extra material alone.","A folded beam holds more weight than a flat sheet of the same paper.","Build a bridge from a fixed number of sheets and test its load safely.","Use folds to resist bending, support the ends, and change one structural feature between trials.","Paper properties; folds and beams; tabs and joints; triangulation; load testing and redesign"],
["homefix","Home Repair Skills","Maker Skills","wrench","A safe repair begins by identifying the system and shutting off relevant energy or water; some jobs require licensed help.","A leaking tap may be a washer issue, but a gas leak requires leaving and calling professionals.","Triage a home repair and distinguish safe checks from work to escalate.","Identify the hazard first, isolate the source only when safe, and use qualified trades for gas, major electrical, or structural work.","Diagnose safely; identify materials; simple fixes; test the repair; know when to call a professional"],
["fashion","Sustainable Fashion","Maker Skills","leaf","Clothing impact depends on how much is made, how long it is used, how it is cared for, and what happens at end of life.","Repairing a seam can extend a garment's useful life with little new material.","Create a care-and-repair plan for a frequently worn item.","Check the care label, mend small damage early, wash only as needed, and donate or recycle responsibly.","Material and care labels; buy for use; washing and repair; reuse and resale; lifecycle trade-offs"],
["upcycling","Creative Upcycling","Maker Skills","wrench","Upcycling turns an unwanted material into something useful by designing around its shape, strength, and limits.","A sturdy shipping box can become a divided drawer organizer instead of being discarded.","Transform one clean household package into a useful object without buying new materials.","Inspect the material, define a new use, test the structure, and finish edges safely; reuse is not suitable for every material.","Find useful materials; match strength to purpose; sketch a new use; build safely; evaluate durability"],
["events","Event Planning","Maker Skills","target","Events run smoothly when goals, roles, timeline, accessibility, budget, and contingency plans are explicit.","A small event timeline assigns setup, welcome, activity, cleanup, and a responsible person to each.","Plan a club event with a limited budget and an outdoor-weather backup.","Define attendee needs, assign owners and times, check access, and prepare a simple contingency.","Goal and audience; scope and budget; timeline and roles; accessibility and safety; run and review"],
["habits","Habit Building","Wellbeing","plant","Habits become easier when a small action is tied to a reliable cue and the environment reduces friction.","After brushing teeth, place tomorrow's book in a bag to cue study.","Design a habit small enough to repeat on a busy day.","Name the cue, make the action tiny, prepare the environment, and track repetitions without demanding perfection.","Cue and routine; start very small; shape environment; recover after a miss; review what works"],
["stress","Stress Management","Wellbeing","heart","Stress tools work best when matched to the situation: breathing, movement, planning, and support are options, not cures for every problem.","A slow exhale and a short walk may help settle a tense moment before a conversation.","Build a personal menu of safe reset strategies and when to ask for help.","Notice the signal, try a suitable calming action, identify the underlying need, and reach out when stress persists.","Notice stress signs; breathing and grounding; movement and breaks; problem-solving; seek trusted support"],
["sleep","Sleep Science","Wellbeing","moon","Sleep supports memory and health. Consistent schedules, light exposure, and a calm wind-down can help; needs vary by person and age.","A regular wake time and morning daylight can help stabilize a sleep routine.","Design a realistic wind-down plan that fits school or work constraints.","Keep timing consistent where possible, reduce late stimulation, and seek a clinician for persistent sleep problems.","Sleep cycles; body clock; light and routines; caffeine and screens; notice when to seek help"],
["emotions","Emotional Intelligence","Wellbeing","heart","Emotional intelligence includes noticing feelings, naming them accurately, and choosing a response rather than acting automatically.","“I feel disappointed” gives more useful information than “everything is terrible.”","Practice responding to a frustrating setback with a pause and a clear request.","Name the feeling, notice the trigger, consider another interpretation, and choose a safe next action.","Notice body signals; name feelings; identify triggers; regulate before responding; communicate a need"],
["goals","Goal Setting","Wellbeing","target","Useful goals are specific and controllable, with small next actions and review points rather than vague wishes.","“Practice scales for ten minutes after dinner on weekdays” is easier to start than “get better at music.”","Turn a large goal into a two-week plan with a fallback for busy days.","Define an observable action, schedule a cue, track progress, and revise the plan when obstacles appear.","Choose a meaningful target; make it observable; break into steps; plan obstacles; review and adapt"],
["learnscience","Learning Science","Wellbeing","brain","Learning lasts when practice retrieves ideas from memory, spaces reviews, and mixes related problems instead of only rereading.","Quiz yourself today, tomorrow, and later in the week rather than highlighting the same page repeatedly.","Build a study session that alternates recall, feedback, and spaced review.","Close the notes, retrieve what you know, correct gaps, and schedule the next review before forgetting.","Attention and goals; retrieval practice; spacing; interleaving and feedback; plan a review cycle"],
["digitalwell","Digital Wellness","Wellbeing","phone","Digital wellness is about intentional use, privacy, rest, and relationships rather than a single screen-time number.","Put a distracting app outside the home screen during a focused task.","Redesign phone settings to support one goal without losing useful contact.","Choose a purpose, silence nonessential alerts, keep safety contacts available, and review how the change feels.","Notice patterns; notifications and focus; privacy and boundaries; sleep and breaks; set a balanced routine"],
["safety","Personal Safety","Wellbeing","lock","Personal safety uses awareness, boundaries, trusted contacts, and help-seeking; responsibility for harm always belongs to the person causing it.","A student can use a planned check-in and trusted adult when a situation feels unsafe.","Build a support map for a fictional person facing an uncomfortable situation.","Trust discomfort, move toward a safer place, contact a trusted person, and use local emergency help for immediate danger.","Recognize discomfort; boundaries and consent; trusted supports; online safety; get help and document concerns"],
["financialplan","Financial Planning","Wellbeing","wallet","A financial plan starts with goals, cash flow, emergency needs, and trade-offs; it should fit the person's circumstances.","Separating regular bills from flexible spending shows what is truly available.","Make a simple monthly plan from income, essential costs, savings, and flexible choices.","Subtract required costs first, reserve a realistic amount for future needs, and adjust wants rather than hiding a shortfall.","Goals and values; income and expenses; essentials and flexibility; emergency savings; review and adjust"],
["decisions","Decision Making","Wellbeing","puzzle","Thoughtful decisions compare options against goals, evidence, risks, and reversibility; not every choice needs perfect certainty.","Try a reversible small test before committing to a costly one-way change.","Choose among three project ideas and explain what evidence would change your mind.","List criteria, compare likely outcomes, test a small reversible step, and set a time to review.","Clarify the decision; gather relevant evidence; compare trade-offs; test reversibly; reflect and update"]

function levelLessons(skill, levelKey){

   c.textAlign="center";c.fillStyle="#cbd5e1";c.font="700 18px system-ui";c.fillText(sel.length===1?`${sel[0].n} ${tg.op==="*"?"×":tg.op==="-"?"−":"+"} ?`:sel.length?exprStr()+(tg.op==="+"?` = ${sel.reduce((a,b)=>a+b.n,0)}`:""):"Tap bubbles that make the target",W/2,578)}}}};

/* ---------- register: replace the quiz versions in the Arcade ---------- */
[chessDef,typingDef,mathDef].forEach(d=>{const g=GM.find(x=>x.id===d.id);if(g){g.f=()=>launch(d);g.n=d.name;g.d=d.pitch.split(".")[0]+".";g.xp=d.xp+60;g.i=d.icon;g.direct=true}});
const a1=AC.find(a=>a.id==="ch");if(a1){a1.n="Checkmate!";a1.d="Checkmate the chess AI on any tier"}
const a2=AC.find(a=>a.id==="ma");if(a2){a2.d="Win a Number Crunch run with zero slips"}
AC.push({id:"sqg1",i:"👑",n:"Chess Master",d:"Beat the Master chess bot",t:()=>S.st["sqg.chess.3"]},{id:"sqg2",i:"🔥",n:"Word Storm",d:"Clear Master Word Blitz",t:()=>S.st["sqg.typing.3"]},{id:"sqg3",i:"🧮",n:"Crunch Champion",d:"Clear Master Number Crunch",t:()=>S.st["sqg.math.3"]},{id:"sqg4",i:"⭐",n:"Triple Threat",d:"Earn 3 stars in any new game tier",t:()=>["chess","typing","math"].some(k=>Object.values((S.gameStats[k]||{}).tb||{}).some(x=>x.stars>=3))});
const prevOpen=window.openGame;window.openGame=id=>{const g=GM.find(x=>x.id===id);if(!(g&&g.direct))return prevOpen(id);cur="game";activeGame=id;G++;const st=S.gameStats[id]||{plays:0,best:0};st.plays=(st.plays||0)+1;S.gameStats[id]=st;save();scrollTo(0,0);g.f()};
return{launch,_t:{pseudo,legal,inCheck,ap,bestMove,parse,search,chessDef,typingDef,mathDef}};
})();

/* ===== Workshop skills -> "Concept Catcher": real-time arcade built from each skill's own learning path ===== */
function workshopDef(s){
 const others=EXPANSION_SKILLS.filter(x=>x.id!==s.id).flatMap(x=>x.topics);
 return{id:s.id,name:s.name+" Workshop",icon:"🧭",cat:"Arcade · "+s.cat,xp:50,coins:25,
 pitch:`Master the ${s.name.toLowerCase()} learning path! Concept cards rain down. Steer your catcher to grab the NEXT concept in learning order and dodge the wrong ones. ${s.core}`,
 controls:"Drag or tap to move the catcher, or use ← → (or A / D).",
 tip:`Coach's model: ${s.model}`,
 tiers:[{name:"Rookie",goal:"Catch all 5 concepts in order · path shown"},{name:"Skilled",goal:"Two full runs · path shown"},{name:"Expert",goal:"Two runs · path hidden until you catch it"},{name:"Master",goal:"Three runs · hidden path · fast cards"}],
 make(e){const T=e.ti,rounds=[1,2,2,3][T],total=rounds*5,spd=[62,82,105,125][T],ml=[5,4,3,3][T],show=T<2,P=s.topics;
  let lives=ml,caught=0,px=240,tx=240,cards=[],nx=.4,score=0,combo=0,bestC=0,lost=false;
  const need=()=>P[caught%5];
  const spawn=()=>{const n=need(),r=Math.random();let t;if(r<.45||!cards.some(c=>c.t===n))t=n;else if(r<.75)t=P.filter(x=>x!==n)[Math.floor(Math.random()*4)];else t=others[Math.floor(Math.random()*others.length)];cards.push({t,x:80+Math.random()*(e.W-160),y:-34})};
  return{dbg:()=>({cards,need:need(),px}),
  tap(x){tx=Math.max(55,Math.min(e.W-55,x))},
  key(k){if(k==="ArrowLeft"||k==="a")tx=Math.max(55,tx-80);else if(k==="ArrowRight"||k==="d")tx=Math.min(e.W-55,tx+80)},
  update(dt){px+=(tx-px)*Math.min(1,dt*14);nx-=dt;if(nx<=0){spawn();nx=Math.max(.55,1.3-caught*.025)*(T>=3?.85:1)}
   for(const c of cards.slice()){c.y+=spd*(1+caught*.02)*dt;
    if(c.y+29>=528&&c.y<=558&&Math.abs(c.x-px)<78){cards=cards.filter(o=>o!==c);
     if(c.t===need()){caught++;combo++;bestC=Math.max(bestC,combo);const pts=Math.round(100*(1+Math.min(combo,6)*.25));score+=pts;e.burst(c.x,c.y,"#4ade80",16);e.float(c.x,c.y-30,"+"+pts,"#bbf7d0");e.sfx.good();if(caught%5===0&&caught<total){e.float(e.W/2,300,"PATH COMPLETE! Again, faster","#fde68a",24)}
      if(caught>=total){e.end({win:true,score:score+lives*150,title:"Skill path mastered!",stats:[`${caught} concepts`,`Best chain ${bestC}`,`${lives} lives left`],bonus:[["No lives lost",!lost],["Unbroken chain",bestC>=total]],learn:s.model});return}}
     else{lives--;lost=true;combo=0;e.shake(8);e.burst(c.x,c.y,"#f87171",16);e.float(c.x,c.y-30,"Wrong concept!","#fca5a5");e.sfx.bad();
      if(lives<=0){e.end({win:false,score,title:"Out of lives",stats:[`${caught}/${total} concepts`,`Best chain ${bestC}`],bonus:[],learn:"Hint: the right order goes from the foundation to the advanced skill. "+s.model});return}}}
    else if(c.y>e.H+40){cards=cards.filter(o=>o!==c);if(c.t===need())combo=0}}},
  draw(c){e.bg(c,"#071a2b","#10294a");c.textAlign="center";
cards.forEach(k=>{e.rr(c,k.x-70,k.y-29,140,58,12);c.fillStyle="#173a63";c.fill();c.lineWidth=2;c.strokeStyle="#38bdf8";c.stroke();c.fillStyle="#fff";c.font="700 12px system-ui";e.wrap(c,k.t,k.x,k.y-8,124,14)});
   c.fillStyle="#0a1f36";c.fillRect(0,0,e.W,132);c.textAlign="left";c.font="800 14px system-ui";c.fillStyle="#7dd3fc";c.fillText(s.name.toUpperCase()+" PATH",14,22);
   P.forEach((t,i)=>{const d=i<caught%5||(caught>=total),cur=i===caught%5&&caught<total;c.font=`${cur?"800":"600"} 12px system-ui`;c.fillStyle=d?"#4ade80":cur?"#fde68a":"#64748b";c.fillText(`${d?"✓":i+1}  ${d||show?t:cur?"?  ? ?":"???"}`,14,42+i*17)});
   c.textAlign="right";c.fillStyle="#fff";c.font="800 20px system-ui";c.fillText(score,e.W-14,26);c.fillStyle="#94a3b8";c.font="600 12px system-ui";c.fillText(`Run ${Math.min(rounds,Math.floor(caught/5)+1)}/${rounds} · chain ${combo}`,e.W-14,44);
   for(let i=0;i<ml;i++){c.beginPath();c.arc(e.W-22-i*18,64,6,0,6.3);c.fillStyle=i<lives?"#f472b6":"rgba(255,255,255,.12)";c.fill()}
   c.fillStyle="rgba(125,211,252,.35)";c.fillRect(0,132,e.W,2);c.textAlign="center";
   e.rr(c,px-55,530,110,18,9);c.fillStyle="#fde68a";c.shadowColor="#fbbf24";c.shadowBlur=14;c.fill();c.shadowBlur=0;c.fillStyle="#cbd5e1";c.font="700 12px system-ui";c.fillText("Catch: "+(caught<total?"concept #"+(caught%5+1):"done"),e.W/2,580)}}}}}
EXPANSION_SKILLS.forEach(s=>{const g=GM.find(x=>x.id===s.id);if(g){const d=workshopDef(s);g.f=()=>SQG.launch(d);g.direct=true;g.d="Catch concepts in learning order";g.i="🧭"}});

hud();go("home");

</script>
